services:
  redis:
    image: redis:7-alpine
    container_name: dietitian_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - dietitian_network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: dietitian_backend
    ports:
      - "8005:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://dietitian_redis:6379
    volumes:
      - ./backend:/app
      - ./datasets:/app/datasets
      - ./FNDDS:/app/FNDDS
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dietitian_network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dietitian_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - dietitian_network
    restart: always

networks:
  dietitian_network:
    driver: bridge

volumes:
  redis_data:
