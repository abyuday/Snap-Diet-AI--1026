services:
  redis:
    image: redis:7-alpine
    container_name: dietitian_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - dietitian_network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:latest
    container_name: dietitian_mongo
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword
    volumes:
      - mongo_data:/data/db
    networks:
      - dietitian_network
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express
    container_name: dietitian_mongo_express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=adminpassword
      - ME_CONFIG_MONGODB_URL=mongodb://admin:adminpassword@mongo:27017/
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongo
    networks:
      - dietitian_network
    restart: always

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: dietitian_backend
    ports:
      - "8005:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://admin:adminpassword@mongo:27017/
      - HF_TOKEN
      - OPENAI_API_KEY
    volumes:
      - ./backend:/app
      - ./datasets:/app/datasets
      - ./FNDDS:/app/FNDDS
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - dietitian_network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dietitian_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - dietitian_network
    restart: always

networks:
  dietitian_network:
    driver: bridge

volumes:
  redis_data:
  mongo_data:
