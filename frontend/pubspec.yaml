name: dietitian_ai
description: AI-Based Dietary Assessment and Nutrient Estimation
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  image_picker: ^1.0.4
  provider: ^6.1.1
  lottie: ^2.7.0
  google_fonts: ^6.1.0
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.18.1
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  fl_chart: ^0.66.2
  flutter_markdown: any
  sensors_plus: ^4.0.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
